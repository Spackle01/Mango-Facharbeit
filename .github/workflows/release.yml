name: Release (Windows-App)

# Läuft bei jedem Push: Tests, Bau des Windows-Installers, Starttest der gebauten und der
# installierten App. Ein Release entsteht, wenn es für die Version aus package.json noch
# keines gibt (Tag v<version> wird dabei angelegt) oder wenn ein Tag v* gepusht wird.
on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test

  build:
    name: Windows-App bauen und prüfen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten für den Build
        run: npm ci --no-audit --no-fund
      - name: Installer bauen
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Starttest der gebauten App
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'start-gebaut.json'
          $exe = Get-Item 'dist\win-unpacked\Mango Facharbeit.exe'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Zeitüberschreitung beim Starttest' }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.platform -ne 'win32' -or -not $r.logo) { throw 'Die App hat die Oberfläche nicht korrekt geladen.' }
      - name: Installer still ausführen und installierte App starten
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Mango-Facharbeit-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Mango Facharbeit.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Die installierte App wurde nicht gefunden.' }
          Write-Host "Installiert: $($installed.FullName)"
          $out = Join-Path $env:RUNNER_TEMP 'start-installiert.json'
          $p = Start-Process -FilePath $installed.FullName -ArgumentList "--smoke-test=$out" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Zeitüberschreitung beim Starttest' }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw 'Die installierte App startet nicht.' }
      - name: Prüfsumme
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter 'Mango-Facharbeit-Setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
            Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB, SHA-256 $hash"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mango-facharbeit-windows
          path: |
            dist/Mango-Facharbeit-Setup-*.exe
            dist/Mango-Facharbeit-Setup-*.exe.sha256
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mango-facharbeit-windows
          path: dist
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          VERSION="${TAG#v}"
          notes="build/release-notes-${VERSION}.md"
          [ -f "$notes" ] || notes="build/release-notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REF_TYPE" = "tag" ]; then
              gh release upload "$TAG" dist/* --clobber
            else
              echo "Release $TAG gibt es schon – nichts zu tun. Für ein neues Release die Version in package.json erhöhen."
            fi
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" $prerelease \
              --title "Mango Facharbeit ${VERSION}" --notes-file "$notes"
          fi
