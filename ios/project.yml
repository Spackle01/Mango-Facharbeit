# Xcode-Projekt der iPad-App, erzeugt mit XcodeGen (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` im Ordner ios/.
# Vorher `ios/vorbereiten.sh` ausführen: Es legt den Server in ios/nodejs-project/ und das Framework NodeMobile in ios/Frameworks/ ab.
name: MangoFacharbeit
options:
  bundleIdPrefix: de.mango
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: '2'
    MARKETING_VERSION: '0.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  MangoFacharbeit:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: nodejs-project
        type: folder
    dependencies:
      - framework: Frameworks/NodeMobile.framework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mango.facharbeit
        PRODUCT_NAME: MangoFacharbeit
        SWIFT_OBJC_BRIDGING_HEADER: App/Mango-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/Frameworks']
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mango Facharbeit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
